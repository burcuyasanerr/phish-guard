<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Phish Guard – Settings</title>
  <style>
    body { font: 14px system-ui, sans-serif; max-width: 560px; margin: 32px auto; color: #222; }
    li { display: flex; justify-content: space-between; padding: 4px 0; }
    input { padding: 6px; width: 70%; }
  </style>

<body>
  <h1>Phish Guard – Settings</h1>

    <input id="host-input" placeholder="example.com" />

  </form>
  <ul id="allowlist"></ul>
  <script src="options.js"></script>
</body>
</html>
