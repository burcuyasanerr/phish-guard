<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Warning – Dangerous Site</title>
  <style>
    body { font: 16px system-ui, sans-serif; background: #b71c1c; color: #fff; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .box { max-width: 560px; text-align: center; padding: 24px; }
    code { background: rgba(0,0,0,.25); padding: 2px 6px; border-radius: 4px; word-break: break-all; }
    button { margin: 8px; padding: 10px 18px; font-size: 15px; border: none; border-radius: 6px; cursor: pointer; }
    #back { background: #fff; color: #b71c1c; font-weight: 600; }
    #proceed { background: transparent; color: #fff; text-decoration: underline; }
  </style>
</head>
<body>
  <div class="box">
    <h1>⛔ This site may be dangerous</h1>
    <p>Phish Guard has detected that the site you are trying to visit is a malicious or phishing site:</p>
    <p><code id="url"></code></p>
    <button id="back">Back to safety</button>
    <button id="proceed">I understand the risk, continue anyway</button>
  </div>
  <script src="warning.js"></script>
</body>
</html>
